<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 viewport-fit=cover, user-scalable=no" />

  <!-- PWA / theme -->
  <meta name="theme-color"                        content="#7C3AED" />
  <meta name="apple-mobile-web-app-capable"       content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style"
        content="black-translucent" />
  <meta name="mobile-web-app-capable"             content="yes" />

  <!-- SEO -->
  <meta name="description"
        content="PrepXP — Premium Study Operating System for JEE & NEET aspirants." />
  <meta name="application-name" content="PrepXP" />

  <!-- Favicon placeholder — replace with your own -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!--
    Google Fonts — preconnect for fastest load.
    Space Grotesk  → display / headings
    Inter           → body text
    JetBrains Mono → numbers / data
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?
      family=Space+Grotesk:wght@400;500;600;700&
      family=Inter:wght@300;400;500;600&
      family=JetBrains+Mono:wght@400;500;600&
      display=swap"
    rel="stylesheet"
  />

  <title>PrepXP</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
